<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wishlist | WAYAY</title>
<meta name="description" content="Your saved WAYAY favorites — everyday clothing for babies and kids.">
<meta name="theme-color" content="#FAF7F2">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23221F1C'/%3E%3Ctext x='50' y='68' font-family='Georgia,serif' font-size='56' fill='%23C97B5A' text-anchor='middle'%3EW%3C/text%3E%3C/svg%3E">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/wayay/css/style.css">
</head>
<body data-base="">

<a class="visually-hidden" href="#main">Skip to content</a>
<header class="site-header" id="wayay-header"></header>
<div id="wayay-overlays"></div>

<main id="main">
  <div class="container">
    <nav class="breadcrumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span>/</span><span>Wishlist</span></nav>
    <div class="wishlist-toolbar">
      <h1 class="h-lg">My Wishlist</h1>
      <span class="result-count" id="wishCount">0 items</span>
    </div>
    <div class="pg" id="wishGrid"></div>
  </div>
</main>

<footer class="site-footer" id="wayay-footer"></footer>

<script src="assets/wayay/js/data.js"></script>
<script src="assets/wayay/js/app.js"></script>
<script>
  function renderWishlistPage(){
    var ids = WAYAY.getWishlist();
    var products = PRODUCTS.filter(function(p){ return ids.indexOf(p.id) > -1; });
    document.getElementById('wishCount').textContent = products.length + ' item' + (products.length===1?'':'s');
    var grid = document.getElementById('wishGrid');
    if (!products.length){
      grid.innerHTML = '';
      var empty = document.createElement('div');
      empty.className = 'state-block';
      empty.style.gridColumn = '1/-1';
      empty.innerHTML = '<svg class="icon" viewBox="0 0 24 24"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>' +
        '<h3>Your wishlist is empty</h3><p>Tap the heart icon on any product to save it here for later.</p>' +
        '<a href="collection.html?cat=all" class="btn btn-primary btn-sm">Explore WAYAY</a>';
      grid.appendChild(empty);
      return;
    }
    WAYAY.renderProductGrid(grid, products);
  }

  WAYAY.loadPartials(function(){
    renderWishlistPage();
    document.addEventListener('click', function(e){
      if (e.target.closest('[data-wish]')) setTimeout(renderWishlistPage, 50);
    });
  });
</script>
</body>
</html>
